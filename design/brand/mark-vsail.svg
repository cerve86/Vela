<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vela">
  <!-- Direction B — "V-Sail". A monogram V whose right arm is the sail's luff,
       so the letter and the sail are one stroke rather than two ideas stacked.
       The left arm is a true wedge — wide at the head, near-point at the vertex —
       which is what makes the V read; a parallel-sided bar reads as a slash.
       Both arms land within 2 units of the same vertex so the V closes. -->
  <path d="M6 5 L16.5 5 L24 41.5 L21 41.5 Z" fill="#FF7B63"/>
  <path d="M39 5 C34 16.5 28.5 29.5 25.5 41.5 L45 41.5 C44 28.5 42 16 39 5 Z" fill="#D93A24"/>
</svg>
