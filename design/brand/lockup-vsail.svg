      <path d="M39 5 C34 16.5 28.5 29.5 25.5 41.5 L45 41.5 C44 28.5 42 16 39 5 Z" fill="#D93A24"/>
  </g>
  <text x="56" y="33.5" font-family="Outfit, 'Outfit Variable', system-ui, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.2" fill="#1F1512">Vela</text>
</svg>
