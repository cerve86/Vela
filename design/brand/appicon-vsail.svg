<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vela">
  <!-- iOS/Android master. Full-bleed ground, no rounding baked in: iOS masks it and
       Android adaptive icons need the bleed. The transform centres the artwork's own
       bounding box, not the 48-unit grid, and lifts it 16px because a sail is
       bottom-heavy and reads low when it is centred geometrically. -->
  <rect width="1024" height="1024" fill="#D93A24"/>
  <g transform="translate(80.5 102.5) scale(16.9231)">
      <path d="M6 5 L16.5 5 L24 41.5 L21 41.5 Z" fill="#FFC6B9"/>
      <path d="M39 5 C34 16.5 28.5 29.5 25.5 41.5 L45 41.5 C44 28.5 42 16 39 5 Z" fill="#FFF6EF"/>
  </g>
</svg>
