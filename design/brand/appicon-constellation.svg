           M30.6 32.4 L31.3 34.2 L33.1 34.9 L31.3 35.6 L30.6 37.4 L29.9 35.6 L28.1 34.9 L29.9 34.2 Z
           M36.4 22.6 L36.9 23.9 L38.2 24.4 L36.9 24.9 L36.4 26.2 L35.9 24.9 L34.6 24.4 L35.9 23.9 Z"/>
