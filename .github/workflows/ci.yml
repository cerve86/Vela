name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The domain maths — recovery, strain, cardiovascular load. These are pure functions
      # and they decide numbers a physiotherapist acts on, so a regression here is silent
      # everywhere else: the screen still renders a tidy percentage.
      - name: Unit tests
        run: npm test

      # next.config refuses a production build with no Supabase configuration, because a
      # deployment built without it is green and broken. CI has to supply the same public
      # values a real build gets. Neither is a secret: the anon key ships inside the
      # client either way, and row level security is what protects the data.
      - name: Build portal
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://eainnbmlzbhfftcpushs.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaW5uYm1semJoZmZ0Y3B1c2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MjE4ODYsImV4cCI6MjEwMjM5Nzg4Nn0.qKuSLi40PpKUAJPEktyWgobnqRGdVWd7mq4B2YvgfEk

  rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A fixed version, the one `npx supabase` runs locally. Asking for "latest" made
      # the action look the release up on GitHub's API unauthenticated, which is
      # rate-limited and failed a run for it. Bump this when bumping the local CLI.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      # The CP1 gate: two clients must not be able to see each other. This job is
      # required on main — a regression here is a data breach, not a bug.
      - name: Run pgTAP policy tests
        run: supabase test db
